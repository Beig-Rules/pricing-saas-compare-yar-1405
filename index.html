<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقایسه پلن‌ها | سی‌آرام یار</title>
  <style>
    body { font-family: Vazirmatn, sans-serif; background:#0a0a0a; color:#f5f5f5; margin:0; }
    .wrap { max-width:900px; margin:3rem auto; padding:0 1rem; }
    h1 { text-align:center; font-size:2.2rem; }
    .plans { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1.5rem; margin-top:2rem; }
    .plan { border:1px solid #333; padding:1.5rem; border-radius:6px; }
    .plan h2 { margin-bottom:0.5rem; }
    .price { font-size:1.8rem; font-weight:700; margin:1rem 0; }
    ul { list-style:none; padding:0; }
    li { padding:0.4rem 0; border-bottom:1px solid #222; }
    .btn { display:block; text-align:center; background:#fff; color:#000; padding:0.7rem; margin-top:1rem; text-decoration:none; font-weight:600; border-radius:4px; }
  </style>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <h1>پلن‌های سی‌آرام یار</h1>
    <div class="plans">
      <div class="plan">
        <h2>پایه</h2>
        <div class="price">رایگان</div>
        <ul><li>تا 50 مشتری</li><li>پشتیبانی ایمیل</li></ul>
        <a href="#" class="btn">شروع کنید</a>
      </div>
      <div class="plan">
        <h2>حرفه‌ای</h2>
        <div class="price">۴۹۹,۰۰۰ تومان</div>
        <ul><li>مشتری نامحدود</li><li>گزارش پیشرفته</li><li>پشتیبانی تلگرام</li></ul>
        <a href="#" class="btn">انتخاب پلن</a>
      </div>
      <div class="plan">
        <h2>سازمانی</h2>
        <div class="price">تماس بگیرید</div>
        <ul><li>چند تیم</li><li>API</li><li>مدیر حساب اختصاصی</li></ul>
        <a href="#" class="btn">درخواست دمو</a>
      </div>
    </div>
  </div>
</body>
</html>
